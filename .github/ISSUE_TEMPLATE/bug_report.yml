name: Bug report
description: Report a reproducible Securedact MCP defect using synthetic data only.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include personal data, credentials, mappings, safe copies, model
        files, or customer logs. Report security issues privately using SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.1 or commit SHA"
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: MCP host
      options:
        - Codex
        - Cursor
        - Windsurf
        - MCP Inspector
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS and Python version; omit usernames and personal paths.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Use only example.test and clearly synthetic identifiers.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I confirm this report contains only synthetic data.
          required: true
        - label: This is not a security vulnerability or accidental data exposure.
          required: true
