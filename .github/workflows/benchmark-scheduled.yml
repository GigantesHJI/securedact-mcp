name: Scheduled synthetic benchmark

on:
  schedule:
    - cron: "43 2 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-medium:
    name: Generate and evaluate public-medium
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Repository steps started — action resolution succeeded
        run: echo "SECUREDACT_CI_STEPS_STARTED=1"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install locked benchmark environment with bounded transient retries
        run: |
          python scripts/retry_network.py -- python -m pip install "uv==0.12.2"
          python scripts/retry_network.py -- uv sync --frozen --extra benchmark
      - name: Generate, validate, and evaluate outside the repository
        env:
          SECUREDACT_BENCHMARK_DATA_DIR: ${{ runner.temp }}/securedact-benchmark-data
          SECUREDACT_REQUIRE_FLAIR: "0"
        run: |
          uv run python -m securedact_eval generate --profile public-medium
          uv run python -m securedact_eval validate --dataset "$SECUREDACT_BENCHMARK_DATA_DIR/generated/public-medium"
          uv run python -m securedact_eval quality --corpus "$SECUREDACT_BENCHMARK_DATA_DIR/generated/public-medium" --aggregate-only --format markdown >> "$GITHUB_STEP_SUMMARY"
