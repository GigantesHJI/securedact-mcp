name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.2"
  UV_FROZEN: "1"

jobs:
  repository-hygiene:
    name: Repository hygiene, format, lint, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Sync locked development environment
        run: uv sync --frozen --extra dev --extra benchmark
      - name: Verify lock consistency and repository boundary
        run: |
          uv lock --check
          uv run python scripts/validate_repo.py --require-implementation
      - name: Check formatting and lint
        run: |
          uv run python -m ruff format --check .
          uv run python -m ruff check .
      - name: Strict type check
        run: uv run python -m mypy src scripts

  tests:
    name: Unit and integration / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install and sync from lock
        run: |
          python -m pip install "uv==${{ env.UV_VERSION }}"
          uv sync --frozen --extra dev --extra benchmark
      - name: Run full synthetic suite
        env:
          SECUREDACT_REQUIRE_FLAIR: "0"
        run: uv run python -m pytest
      - name: Parse Windows bootstrap installer
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/install-securedact-mcp.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

  privacy-and-evaluation:
    name: Privacy regression and deterministic benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --frozen --extra dev --extra benchmark
      - name: Run privacy regression suite
        env:
          SECUREDACT_REQUIRE_FLAIR: "0"
        run: |
          uv run python -m pytest tests/privacy
          uv run python scripts/run_privacy_tests.py
      - name: Evaluator self-tests and release gate
        env:
          SECUREDACT_REQUIRE_FLAIR: "0"
        run: |
          uv run python -m pytest tests/evaluation
          uv run python -m pytest tests/evaluation/test_mocked_flair.py
          uv run python -m securedact_eval quality --mode deterministic --gate --thresholds benchmarks/thresholds.json --baseline benchmarks/baselines/quality-deterministic.json --output-dir benchmark-results
      - name: Bounded deterministic performance report and broad latency gate
        run: uv run python -m securedact_eval performance --mode deterministic --repetitions 10 --warmups 2 --gate --thresholds benchmarks/thresholds.json --output benchmark-results/performance-deterministic.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deterministic-benchmark-results
          path: benchmark-results/
          if-no-files-found: error

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-and-license-audit:
    name: Dependency and license audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --frozen --extra security
      - name: Audit resolved dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file dependency-audit-requirements.txt
          uv run pip-audit --strict --requirement dependency-audit-requirements.txt
      - name: Produce dependency license report
        run: |
          uv run pip-licenses --format=json --output-file=dependency-licenses.json
          uv run python scripts/validate_dependency_licenses.py dependency-licenses.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-license-report
          path: |
            dependency-audit-requirements.txt
            dependency-licenses.json
          if-no-files-found: error

  package:
    name: Build, inspect, clean-install, and SBOM
    runs-on: ubuntu-latest
    needs:
      [repository-hygiene, tests, privacy-and-evaluation, secret-scan, dependency-and-license-audit]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==${UV_VERSION}"
      - run: uv sync --frozen --extra dev
      - name: Build and inspect distributions
        run: |
          uv run python -m build
          uv run python -m twine check dist/*
          uv run python scripts/validate_release_artifacts.py dist
      - name: Clean-install exact wheel with locked runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file dist/runtime-requirements.txt
          uv venv .clean-venv --python 3.12
          uv pip install --python .clean-venv/bin/python --requirements dist/runtime-requirements.txt
          uv pip install --python .clean-venv/bin/python --no-deps dist/*.whl
          .clean-venv/bin/python scripts/smoke_test_entrypoint.py
          .clean-venv/bin/securedact-mcp --help
          .clean-venv/bin/securedact-mcp models list
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: dist/securedact-mcp.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: securedact-mcp-distributions
          path: dist/*
          if-no-files-found: error
