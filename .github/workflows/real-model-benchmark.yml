name: Real-model benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flair-quality-and-performance:
    name: Pre-provisioned Flair benchmark
    runs-on: [self-hosted, securedact-models]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install "uv==0.12.2"
      - run: uv sync --frozen --extra ml --extra dev --extra benchmark
      - name: Evaluate pre-provisioned local Flair model
        env:
          SECUREDACT_EVAL_FLAIR_MODEL: ${{ vars.SECUREDACT_EVAL_FLAIR_MODEL }}
          SECUREDACT_EVAL_MODEL_ID: ${{ vars.SECUREDACT_EVAL_MODEL_ID }}
        run: |
          uv run python -m securedact_eval quality --mode flair --corpus benchmarks/corpora --output-dir real-model-results
          uv run python -m securedact_eval performance --mode flair --repetitions 20 --warmups 3 --output real-model-results/performance-flair.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: real-model-benchmark-results
          path: real-model-results/
          if-no-files-found: error
