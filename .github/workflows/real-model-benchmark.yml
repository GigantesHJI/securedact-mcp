name: Real-model benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-model-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flair-quality-and-performance:
    name: Pre-provisioned Flair benchmark
    runs-on: [self-hosted, securedact-models]
    timeout-minutes: 90
    steps:
      - name: Repository steps started — action resolution succeeded
        run: echo "SECUREDACT_CI_STEPS_STARTED=1"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install locked model environment with bounded transient retries
        run: |
          python scripts/retry_network.py -- python -m pip install "uv==0.12.2"
          python scripts/retry_network.py -- uv sync --frozen --extra ml --extra dev --extra benchmark
      - name: Evaluate the pre-provisioned local Flair model
        env:
          SECUREDACT_EVAL_FLAIR_MODEL: ${{ vars.SECUREDACT_EVAL_FLAIR_MODEL }}
          SECUREDACT_EVAL_MODEL_ID: ${{ vars.SECUREDACT_EVAL_MODEL_ID }}
        run: |
          uv run python -m securedact_eval quality --mode flair --corpus benchmarks/corpora --aggregate-only --format markdown >> "$GITHUB_STEP_SUMMARY"
          uv run python -m securedact_eval performance --mode flair --repetitions 20 --warmups 3 --output real-model-performance.json
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat real-model-performance.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
