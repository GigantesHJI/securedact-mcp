name: Release artifacts

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Validate repository
        run: python scripts/validate_repo.py --require-implementation

      - name: Check formatting, lint, and types
        run: |
          python -m ruff format --check .
          python -m ruff check .
          python -m mypy src/securedact_core src/securedact_mcp scripts

      - name: Run tests and privacy gate
        run: |
          python -m pytest
          python scripts/run_privacy_tests.py
          python -m pytest tests/unit/test_model_registry.py tests/unit/test_model_installer.py tests/unit/test_model_store.py tests/unit/test_cli.py tests/unit/test_managed_runtime.py tests/integration/test_model_setup.py tests/integration/test_offline_model_verifier.py tests/integration/test_managed_stdio_subprocess.py

      - name: Build and verify distributions
        run: |
          python -m build
          python -m twine check dist/*
          python scripts/validate_release_artifacts.py dist

      - name: Clean-install and smoke-test wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python scripts/smoke_test_entrypoint.py
          securedact-mcp --help
          securedact-mcp models list

      - uses: actions/upload-artifact@v4
        with:
          name: securedact-mcp-release
          path: dist/*
          if-no-files-found: error

      - name: Attach distributions to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
