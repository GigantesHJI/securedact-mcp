name: Signed release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.2"
  UV_FROZEN: "1"

jobs:
  verify-and-build:
    name: Verify and build exact release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Repository steps started — action resolution succeeded
        run: echo "SECUREDACT_CI_STEPS_STARTED=1"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install locked release environment with bounded transient retries
        run: |
          python scripts/retry_network.py -- python -m pip install "uv==${UV_VERSION}"
          python scripts/retry_network.py -- uv sync --frozen --extra dev --extra benchmark --extra security
      - name: Validate annotated tag, version, changelog, and clean commit
        run: uv run python scripts/release_metadata.py validate
      - name: Repository, format, lint, and strict type gates
        run: |
          uv lock --check
          uv run python scripts/validate_repo.py --require-implementation
          uv run python scripts/validate_repository_size.py
          uv run python scripts/validate_workflows.py
          uv run python -m ruff format --check .
          uv run python -m ruff check .
          uv run python -m mypy src scripts
      - name: Unit, integration, privacy, and evaluator tests
        env:
          SECUREDACT_REQUIRE_FLAIR: "0"
        run: |
          uv run python -m pytest
          uv run python scripts/run_privacy_tests.py
      - name: Deterministic release gates
        run: |
          uv run python -m securedact_eval quality --mode deterministic --gate --thresholds benchmarks/thresholds.json --baseline benchmarks/baselines/quality-deterministic.json --aggregate-only --output-dir dist
          uv run python -m securedact_eval performance --mode deterministic --repetitions 20 --warmups 3 --gate --thresholds benchmarks/thresholds.json --output dist/performance-deterministic.json
      - name: Build, metadata check, and artifact inspection
        run: |
          uv run python -m build --no-isolation
          uv run python -m twine check dist/*.whl dist/*.tar.gz
          uv run python scripts/validate_release_artifacts.py dist
      - name: Clean-install exact wheel and smoke-test console and MCP protocol
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file dist/runtime-requirements.txt
          uv venv .clean-venv --python 3.12
          python scripts/retry_network.py -- uv pip install --python .clean-venv/bin/python --requirements dist/runtime-requirements.txt
          uv pip install --python .clean-venv/bin/python --no-deps dist/*.whl
          .clean-venv/bin/python scripts/smoke_test_entrypoint.py
          .clean-venv/bin/securedact-mcp setup --help
          .clean-venv/bin/python scripts/smoke_test_setup.py
          .clean-venv/bin/python scripts/smoke_test_mcp.py .clean-venv/bin/securedact-mcp
      - name: Dependency and license audit
        run: |
          python scripts/retry_network.py -- uv run pip-audit --strict --requirement dist/runtime-requirements.txt
          uv run pip-licenses --format=json --output-file=dist/dependency-licenses.json
          uv run python scripts/validate_dependency_licenses.py dist/dependency-licenses.json
      - name: Generate CycloneDX SBOM with the locked Python tool
        run: uv run cyclonedx-py environment --output-format JSON --output-file dist/securedact-mcp.cdx.json
      - name: Generate checksums and repository provenance record
        run: uv run python scripts/release_metadata.py metadata
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: securedact-mcp-release-candidate
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: securedact-mcp-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  sign-attest-and-release:
    name: Keyless sign, attest, and attach to GitHub release
    needs: [verify-and-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Repository steps started — action resolution succeeded
        run: echo "SECUREDACT_CI_STEPS_STARTED=1"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: securedact-mcp-release-candidate
          path: dist
      - uses: sigstore/gh-action-sigstore-python@f7ad0af51a5648d09a20d00370f0a91c3bdf8f84 # v3.0.1
        with:
          inputs: >-
            ./dist/*.whl
            ./dist/*.tar.gz
            ./dist/SHA256SUMS
            ./dist/securedact-mcp.cdx.json
            ./dist/provenance.json
      - uses: actions/attest-build-provenance@78e6cbd37d0ac1a40113c04f2037dacf1ea3f12e # v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/securedact-mcp.cdx.json
            dist/provenance.json
      - name: Create GitHub release and attach verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/retry_network.py --attempts 3 --attempt-timeout 180 --overall-timeout 420 -- gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "Securedact MCP ${GITHUB_REF_NAME}"

  publish-pypi:
    name: Publish validated distributions to PyPI
    needs: [verify-and-build, sign-attest-and-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/securedact-mcp
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Repository steps started — action resolution succeeded
        run: echo "SECUREDACT_CI_STEPS_STARTED=1"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: securedact-mcp-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
