[extend]
useDefault = true

# Synthetic secret fixtures used by the credential/firewall detector tests and
# the firewall benchmark. These are DELIBERATE fake secrets (example.com /
# securedact.com style, no real credentials) that exist only to validate
# SecuRedact's credential/firewall detection behavior. They are allowlisted by
# EXACT file path so that generic-api-key, aws-access-token, private-key and
# every other rule stay fully active for all production source, docs, configs,
# workflows, manifests, scripts outside the benchmark fixture, and every other
# file. Do not broaden this to a blanket `tests/.*` or `scripts/.*` allowlist.

[[allowlists]]
description = "Synthetic credential/firewall test fixtures (deliberate fake secrets)"
paths = [
  '''tests/unit/test_credentials_detector\.py''',
  '''tests/unit/test_firewall_backward_compat\.py''',
  '''tests/unit/test_safe_read_file\.py''',
  '''tests/unit/test_firewall_egress\.py''',
  '''tests/unit/test_gemini_enforced\.py''',
  '''tests/privacy/test_policy_storage_and_audit\.py''',
  '''tests/privacy_corpus/adversarial/credential_blocks\.json''',
  '''benchmarks/corpora/release_gate\.json''',
  '''examples/synthetic-test-prompts\.md''',
  '''scripts/benchmark_firewall\.py''',
]
