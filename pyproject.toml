[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "securedact-mcp"
version = "0.1.0"
description = "Local-first privacy MCP server for sensitive AI workflows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE.md"]
dependencies = [
  "cryptography>=43,<47",
  "mcp>=1.2,<2",
  "pydantic>=2.10,<3",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]

[project.optional-dependencies]
ml = [
  "flair>=0.15,<1",
  "huggingface-hub>=0.28,<1",
  "torch>=2.5,<3",
]
dev = [
  "build>=1.2.2,<2",
  "hypothesis>=6.100,<7",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "twine>=6.1,<7",
]

[project.scripts]
securedact-mcp = "securedact_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["securedact_mcp*", "securedact_core*"]

[tool.setuptools.package-data]
"securedact_core.detectors" = ["lexicons/*.json"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"src/securedact_core/detectors/contextual_detector.py" = ["RUF001"]
"src/securedact_core/detectors/regex_detector.py" = ["RUF001"]
"src/securedact_core/models.py" = ["S105"]
"tests/**/*.py" = ["S101", "S311"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["securedact_core", "securedact_mcp"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
files = ["src/securedact_core", "src/securedact_mcp", "scripts"]

[[tool.mypy.overrides]]
module = ["flair", "flair.*"]
ignore_missing_imports = true
