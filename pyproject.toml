[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "securedact-mcp"
version = "0.4.2"
description = "Local-first privacy MCP server for sensitive AI workflows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE.md", "NOTICE"]
dependencies = [
  "cryptography>=50,<51",
  "mcp>=1.2,<2",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0.2,<7",
  "pywin32>=306,<312; sys_platform == \"win32\"",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/GigantesHJI/securedact-mcp"
Repository = "https://github.com/GigantesHJI/securedact-mcp"
Issues = "https://github.com/GigantesHJI/securedact-mcp/issues"
Changelog = "https://github.com/GigantesHJI/securedact-mcp/blob/main/CHANGELOG.md"
Documentation = "https://github.com/GigantesHJI/securedact-mcp/tree/main/docs"

[project.optional-dependencies]
ml = [
  "flair>=0.15,<1",
  "gliner>=0.2.13,<1",
  "huggingface-hub>=0.28,<1",
  "torch>=2.5,<3",
  "transformers>=4.41,<5",
]
dev = [
  "build>=1.2.2,<2",
  "hypothesis>=6.100,<7",
  "mypy>=1.17,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
  "setuptools>=75",
  "twine>=6.1,<7",
  "types-PyYAML>=6.0.12,<7",
  "types-psutil>=6,<8",
  "wheel>=0.45,<1",
]
benchmark = [
  "Faker==40.35.0",
  "psutil>=6,<8",
]
google = [
  "google-auth>=2.29,<3",
  "google-auth-oauthlib>=1.2,<2",
]
security = [
  "cyclonedx-bom>=6,<8",
  "pip-audit>=2.9,<3",
  "pip-licenses>=5,<6",
  "sigstore>=3,<5",
]

[project.scripts]
securedact-mcp = "securedact_mcp.cli:main"
securedact-eval = "securedact_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["securedact_mcp*", "securedact_core*", "securedact_eval*", "securedact_enforced*"]
exclude = [
    "securedact_eval.experimental",
    "securedact_eval.experimental.*",
]

[tool.setuptools.package-data]
"securedact_core.detectors" = ["lexicons/*.json"]
"securedact_mcp.setup_assets" = [
  "claude/.claude-plugin/*.json",
  "claude/integrations/claude-code-enforced/securedact-enforced/.claude-plugin/*.json",
  "claude/integrations/claude-code-enforced/securedact-enforced/hooks/*.json",
  "claude/integrations/claude-code-enforced/securedact-enforced/skills/securedact-enforced/*.md",
  "gemini/*.json",
  "gemini/hooks/*.json",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  "build",
  "dist",
  ".kilo",
  "scripts/experimental",
  "src/securedact_eval/experimental",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"src/securedact_core/detectors/contextual_detector.py" = ["RUF001"]
"src/securedact_core/detectors/regex_detector.py" = ["RUF001"]
"src/securedact_core/models.py" = ["S105"]
"tests/**/*.py" = ["S101", "S311"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "windows: Windows-only behavior requiring Windows APIs/runtime (Task Scheduler, win32api, setx /M, UAC). Skipped on non-Windows CI; run on a Windows job.",
]

[tool.coverage.run]
branch = true
source = ["securedact_core", "securedact_mcp"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
files = ["src/securedact_core", "src/securedact_mcp", "scripts"]
exclude = ["src/securedact_eval/experimental", "scripts/experimental"]

[[tool.mypy.overrides]]
module = [
  "flair",
  "flair.*",
  "huggingface_hub",
  "huggingface_hub.*",
  "transformers",
  "transformers.*",
  "torch",
  "torch.*",
  "gliner",
  "gliner.*",
  "psutil",
  "yaml",
  "google",
  "google.*",
  "google_auth_oauthlib",
  "google_auth_oauthlib.*",
  "win32serviceutil",
  "win32service",
  "win32api",
  "win32con",
  "pywintypes",
  "servicemanager",
  "win32security",
]
ignore_missing_imports = true

